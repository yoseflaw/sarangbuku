{% load static %}
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sarang Buku{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/sarangbuku.css' %}">
</head>
<body>
  <a class="sb-skip-link" href="#konten">Lewati ke konten</a>
  <header class="border-bottom">
    <div class="container py-3 d-flex flex-wrap align-items-center justify-content-between gap-3">
      <a class="sb-wordmark" href="/">Sarang Buku</a>
      <nav class="d-flex flex-wrap align-items-center gap-3" aria-label="Akun">
        {% if user.is_authenticated %}
          <a href="{% url 'books:discover' %}">Temukan</a>
          <a href="{% url 'books:shelf' %}">Lemari</a>
          <a href="{% url 'books:add' %}">Tambah</a>
          <a href="{% url 'books:wishlist' %}">Daftar Minat</a>
          <a href="{% url 'accounts:profile' %}">Profil</a>
          <form method="post" action="{% url 'accounts:logout' %}" class="mb-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-link p-0 text-dark">Keluar</button>
          </form>
        {% else %}
          <a href="{% url 'accounts:login' %}">Masuk</a>
          <a href="{% url 'accounts:register' %}">Daftar dengan undangan</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main id="konten" class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container border-top py-4 mt-5">
    <small>Sarang Buku (2026)</small>
  </footer>
</body>
</html>
